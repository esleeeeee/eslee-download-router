name: Build Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/DownloadRouter.Extension/package-lock.json

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build and test
        shell: pwsh
        run: |
          .\scripts\bootstrap.ps1
          .\scripts\build.ps1 -Configuration Release
          .\scripts\test.ps1 -Configuration Release

      - name: Build installer
        shell: pwsh
        run: .\scripts\build-installer.ps1 -Configuration Release

      - name: Verify release privacy
        shell: pwsh
        run: .\scripts\verify-release-privacy.ps1

      - name: Record release provenance
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          if ("v$($props.Project.PropertyGroup.VersionPrefix)" -ne $env:GITHUB_REF_NAME) { throw 'Tag/version mismatch' }
          $file = Get-FileHash artifacts/installer/eslee-download-router-setup.exe -Algorithm SHA256
          "$($file.Hash.ToLower())  eslee-download-router-setup.exe" | Set-Content artifacts/installer/SHA256SUMS.txt
          @{source_sha=$env:GITHUB_SHA; run_id=$env:GITHUB_RUN_ID; sha256=$file.Hash.ToLower(); checks=@('Release build','Core/Infrastructure/Integration/extension tests','Release privacy','Inno installer')} | ConvertTo-Json | Set-Content artifacts/installer/verification-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: artifacts/installer/*
      - name: Create new GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME artifacts/installer/eslee-download-router-setup.exe artifacts/installer/SHA256SUMS.txt artifacts/installer/verification-manifest.json --verify-tag --title "eslee Download Router $env:GITHUB_REF_NAME" --notes-file ".github/release-notes/$env:GITHUB_REF_NAME.md"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
