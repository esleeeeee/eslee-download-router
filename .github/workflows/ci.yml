name: CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/DownloadRouter.Extension/package-lock.json
      - name: Restore .NET
        run: dotnet restore DownloadRouter.slnx --configfile NuGet.Config
      - name: Restore extension
        working-directory: src/DownloadRouter.Extension
        run: npm ci
      - name: Build
        run: .\scripts\build.ps1 -Configuration Release
      - name: Test
        run: .\scripts\test.ps1 -Configuration Release
      - name: Record validation evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/validation | Out-Null
          git rev-parse HEAD | Set-Content artifacts/validation/source-sha.txt
          Get-ChildItem src -Recurse -File -Filter *.dll | Where-Object FullName -Match '[\\/]bin[\\/]' | Get-FileHash -Algorithm SHA256 | Select-Object Path,Hash | ConvertTo-Json | Set-Content artifacts/validation/sha256.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-validation
          path: artifacts/validation
